[package]
name = "gfx-cli"
description = "gfx pass-driver CLI library: pass registry, arg model, rewrite_binary! macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gfx = { workspace = true, features = ["std", "git", "remap", "strip-blobs", "redact"] }
gfx-strip-blobs = { workspace = true }
toml = { version = "0.8", features = ["parse"] }

