[package]
name = "gfx"
description = "Sans-IO, no_std library for the git fast-export protocol, with optional builtins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
remap = ["dep:gfx-remap"]
strip-blobs = ["dep:gfx-strip-blobs"]
redact = ["dep:gfx-redact"]
blob-xform = ["dep:gfx-blob-xform"]
std = ["dep:flate2"]
# std + git subprocess drivers (integration testing / convenience; plan §9)
git = ["std"]

[dependencies]
gfx-core = { workspace = true }
flate2 = { workspace = true, optional = true }
gfx-remap = { workspace = true, optional = true }
gfx-redact = { workspace = true, optional = true }
gfx-strip-blobs = { workspace = true, optional = true }
gfx-blob-xform = { workspace = true, optional = true }

[dev-dependencies]
gfx-remap = { workspace = true }
