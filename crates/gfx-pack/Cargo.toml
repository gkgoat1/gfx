[package]
name = "gfx-pack"
description = "Multistream archives: fan-out export → passes → zip (optionally encrypted), and the reverse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gfx = { workspace = true, features = ["std", "git", "remap", "strip-blobs", "redact", "blob-xform"] }
gfx-redact = { workspace = true }
flate2 = { workspace = true }
crc32fast = "1"
sha2 = "0.10"
toml = { version = "0.8", features = ["parse"] }
age = { version = "0.12", default-features = false, features = ["armor"] }
