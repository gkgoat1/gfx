[package]
name = "gfx-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gfx-strip-blobs = { path = "../crates/gfx-strip-blobs" }
gfx-ignore = { path = "../crates/gfx-ignore" }
gfx-enforce-ignore = { path = "../crates/gfx-enforce-ignore" }
gfx-redact = { path = "../crates/gfx-redact" }
gfx-core = { path = "../crates/gfx-core" }
gfx-blob-xform = { path = "../crates/gfx-blob-xform" }
gfx-pack = { path = "../crates/gfx-pack" }

[[bin]]
name = "glob_match"
path = "fuzz_targets/glob_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ignore_match"
path = "fuzz_targets/ignore_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "enforce_ignore_roundtrip"
path = "fuzz_targets/enforce_ignore_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redact_roundtrip"
path = "fuzz_targets/redact_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strip_roundtrip"
path = "fuzz_targets/strip_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blob_xform_roundtrip"
path = "fuzz_targets/blob_xform_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

# Standalone: cargo-fuzz convention; excluded from the main workspace.
[workspace]
