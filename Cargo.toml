[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/gfx-cli",
    "crates/gfx-pack",
    "crates/gfx-redact",
    "crates/gfx-strip-blobs",
    "crates/gfx-vindex",
    "crates/gfx-core",
    "crates/gfx-hash",
    "crates/gfx-remap",
    "crates/gfx",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/gfx"

[workspace.dependencies]
bstr = { version = "1", default-features = false, features = ["alloc"] }
gfx-core = { path = "crates/gfx-core" }
gfx = { path = "crates/gfx" }
gfx-hash = { path = "crates/gfx-hash" }
gfx-remap = { path = "crates/gfx-remap" }
gfx-cli = { path = "crates/gfx-cli" }
gfx-pack = { path = "crates/gfx-pack" }
gfx-redact = { path = "crates/gfx-redact" }
gfx-strip-blobs = { path = "crates/gfx-strip-blobs" }
gfx-vindex = { path = "crates/gfx-vindex" }
